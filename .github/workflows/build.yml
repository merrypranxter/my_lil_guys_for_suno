name: Build and Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Composition Lab regression smoke
        run: npm run verify:composition

      - name: Music Seed Lab regression smoke
        run: npm run verify:seed

      - name: Music Genetics regression smoke
        run: npm run verify:breeding

      - name: Petri Dish regression smoke
        run: npm run verify:dish

      - name: Mind activation budget regression smoke
        run: npm run verify:minds

      - name: Generation jurisdiction regression smoke
        run: npm run verify:jurisdictions

      - name: Genome phenotype and dedupe regression smoke
        run: npm run verify:genome-surgery

      - name: Fitness and reproductive selection regression smoke
        run: npm run verify:fitness

      - name: Success saturation and cooldown regression smoke
        run: npm run verify:saturation

      - name: Mouth Lab foundation regression smoke
        run: npm run verify:mouth-lab

      - name: Mouth Lab breeding regression smoke
        run: npm run verify:mouth-breeding

      - name: Mouth Lab quirk/specimen regression smoke
        run: npm run verify:mouth-quirks

      - name: Mouth Lab prompt compiler regression smoke
        run: npm run verify:mouth-compiler

      - name: Build
        run: npm run build

      - name: Production server smoke
        shell: bash
        run: |
          NODE_ENV=production node dist/server.cjs > /tmp/little-guy-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/info > /tmp/little-guy-info.json; then
              cat /tmp/little-guy-info.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/little-guy-server.log
          exit 1
