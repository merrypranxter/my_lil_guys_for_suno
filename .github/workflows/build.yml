name: Build and Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Composition Lab regression smoke
        run: npm run verify:composition

      - name: Build
        run: npm run build

      - name: Production server smoke
        shell: bash
        run: |
          NODE_ENV=production node dist/server.cjs > /tmp/little-guy-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/info > /tmp/little-guy-info.json; then
              cat /tmp/little-guy-info.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/little-guy-server.log
          exit 1
